<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Tracker</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      font-size: 36px;
      text-align: center;
    }
    h2 {
      font-size: 28px;
    }

    .product-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .product-card {
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }
    .product-image {
      width: 100%;
      max-width: 250px;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
    }
    .product-name {
      font-size: 30px;
      margin-bottom: 5px;
    }
    .product-price {
      font-size: 26px;
      font-weight: bold;
    }


    
    .sale-button {
      font-size: 40px;
      font-weight: bold;
      width: 80px;
      height: 70px;
      margin: 10px;
      cursor: pointer;
    }
    .sold-count {
      font-size: 36px;
      font-weight: bold;
      margin: 0 15px;
    }


    
    .product-revenue {
      font-size: 22px;
    }

    input {
      font-size: 20px;
      padding: 12px;
      margin: 5px;
    }
    .normal-button {
      font-size: 20px;
      padding: 12px 18px;
      margin: 5px;
      cursor: pointer;
    }


    
    summary {
      font-size: 20px;
      cursor: pointer;
      margin-top: 15px;
    }
    .totals {
      background-color: white;
      border: 3px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin-top: 30px;
    }
    .individual-total {
      font-size: 20px;
    }
    .grand-total {
      font-size: 28px;
      font-weight: bold;
    }

  </style>
</head>
<body>
<h1>Sales Tracker</h1>
<h2>Add Product</h2>
<div class="add-options">
    <button
          class="normal-button"
          type="button"
          onclick="showManualForm()">
      Add Manually
  </button>
  <button
          class="normal-button"
          type="button"
          onclick="showExcelForm()">
      Import Excel
  </button>

</div>

<div id="manual-form">
<form action="/add" method="post" enctype="multipart/form-data">
  <input
          type="text"
          name="name"
          placeholder="Product Name"
          required>
  <input
          type="number"
          name="price"
          step="0.01"
          placeholder="Price"
          required>
  <input
          type="file"
          name="image"
          accept="image/*">
  <button
          class="normal-button"
          type="submit">
    Add Product
  </button>
</form>
</div>
<div id="excel-form" style="display: none;">
  <h3>Import Products from Excel</h3>
  <p>
    Column A: Product Name<br>
    Column B: Price
  </p>
  <form action="/import"
        method="post"
        enctype="multipart/form-data">
    <input
            type="file"
            name="file"
            accept=".xlsx"
            required>
    <button
            class="normal-button"
            type="submit">
      Import Products
    </button>
  </form>
</div>
<hr>


<h2>Products</h2>
<div class="product-container">
  <div
          class="product-card"
          th:each="product : ${products}"
          th:id="'product-' + ${product.id}">
    <img
            class="product-image"
            th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}"
            th:src="${product.imageUrl}"
            alt="Product Image">
    <h2
            class="product-name"
            th:text="${product.name}">
    </h2>

    <p class="product-price">
      $<span
            th:text="${#numbers.formatDecimal(product.price, 1, 2)}">
            </span>
    </p>

<form
        class="sale-form"
        th:action="@{/minus/{id}(id=${product.id})}"
        method="post"
        style="display:inline">
    <button
            class="sale-button"
            type="submit">
        −
    </button>
</form>
    <span
            class="sold-count"
            th:text="${product.soldCount}">
        </span>

    <form
        class="sale-form"
        th:action="@{/plus/{id}(id=${product.id})}"
        method="post"
        style="display:inline">

      <button
              class="sale-button"
              type="submit">
        +
      </button>
    </form>


    <p class="product-revenue">
      Revenue:
      <strong>
        $<span
              th:text="${#numbers.formatDecimal(product.revenue, 1, 2)}">
                </span>
      </strong>
    </p>

    
    <details>
      <summary>Edit Product</summary>
      <form
              th:action="@{/edit/{id}(id=${product.id})}"
              method="post">
        <input
                type="text"
                name="name"
                th:value="${product.name}"
                required>
        <input
                type="number"
                name="price"
                step="0.01"
                th:value="${product.price}"
                required>
        <br>
        <button
                class="normal-button"
                type="submit">
          Save Changes
        </button>
      </form>



    
      <form
              th:action="@{/delete/{id}(id=${product.id})}"
              method="post">
        <button
                class="normal-button"
                type="submit">
          Delete Product
        </button>
      </form>
    </details>
  </div>
</div>


<div class="totals">
  <h2>Sales Summary</h2>
  <div
          th:each="product : ${products}"
          class="individual-total">
    <p>
      <strong th:text="${product.name}"></strong>
      :
      <span th:text="${product.soldCount}"></span>
      sold
      —
      $<span
            th:text="${#numbers.formatDecimal(product.revenue, 1, 2)}">
            </span>
    </p>
  </div>
  <hr>


  
  <p class="grand-total">
    Total Items Sold:
    <span th:text="${totalItemsSold}"></span>
  </p>
  <p class="grand-total">
    Total Revenue:
    $<span
          th:text="${#numbers.formatDecimal(totalRevenue, 1, 2)}">
        </span>
  </p>
</div>
<script>
  function showManualForm() {
    document.getElementById("manual-form")
            .style.display = "block";
    document.getElementById("excel-form")
            .style.display = "none";
  }
  function showExcelForm() {
    document.getElementById("manual-form")
            .style.display = "none";
    document.getElementById("excel-form")
            .style.display = "block";
  }
</script>
</body>
</html>
